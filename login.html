<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="오픈매니저 로그인.">
<title>로그인 — 오픈매니저 OpenManager</title>
  <link rel="icon" type="image/png" href="favicon.png?v=3">
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=3">
  <link rel="manifest" href="manifest.json?v=1">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="오픈매니저">
<meta name="theme-color" content="#4F46E5">
<script src="https://cdn.tailwindcss.com"></script>
<script src="phone-util.js?v=202608040602"></script>
<script src="idle-util.js?v=202608040602"></script>
<script src="mobile-util.js?v=202608040602"></script>
<script src="version.js?v=202608040602"></script>
<script src="footer-util.js?v=202608040602"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  body{font-family:'Pretendard',-apple-system,sans-serif;}
  .card{border:1px solid #E2E8F0;}
  input:focus{outline:none;border-color:#6366F1;box-shadow:0 0 0 3px rgba(99,102,241,.12);}
</style>
</head>
<body class="min-h-screen bg-slate-50 flex items-center justify-center px-4">

<div class="w-full max-w-md">
  <!-- 로고 -->
  <div class="text-center mb-8">
    <a href="index.html"><img src="logo-horizontal.png" alt="오픈매니저 OpenManager"
      class="h-14 sm:h-16 w-auto max-w-[88%] mx-auto object-contain"></a>
    <p class="text-sm text-slate-500 mt-4">프랜차이즈 오픈 관리를 한곳에서</p>
  </div>

  <!-- 로그인 카드 -->
  <div class="card bg-white rounded-2xl p-8">
    <h1 class="text-lg font-bold text-slate-900 mb-4">로그인</h1>
    <div id="idleNotice" class="hidden mb-4 rounded-lg bg-amber-50 border border-amber-200 px-3.5 py-2.5 text-[12.5px] text-amber-800 leading-relaxed break-keep">
      일정 시간 사용하지 않아 자동으로 로그아웃되었습니다. 다시 로그인해 주세요.
    </div>
    <div class="space-y-4">
      <div>
        <label class="block text-[13px] font-semibold text-slate-600 mb-1.5">이메일</label>
        <input id="email" type="email" placeholder="admin@company.com"
          class="w-full px-3.5 py-2.5 rounded-lg border border-slate-200 text-base sm:text-sm text-slate-900 placeholder-slate-300 transition">
      </div>
      <div>
        <label class="block text-[13px] font-semibold text-slate-600 mb-1.5">비밀번호</label>
        <input id="password" type="password" placeholder="••••••••"
          class="w-full px-3.5 py-2.5 rounded-lg border border-slate-200 text-base sm:text-sm text-slate-900 placeholder-slate-300 transition">
      </div>
      <p id="errMsg" class="hidden text-[13px] text-rose-600 font-medium"></p>
      <button id="loginBtn" onclick="doLogin()"
        class="w-full py-2.5 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-bold transition">
        로그인
      </button>
    </div>
    <div class="flex items-center justify-between mt-5 text-[13px]">
      <button onclick="resetPassword()" class="text-slate-400 hover:text-indigo-600 transition">비밀번호를 잊으셨나요?</button>
      <a href="signup.html" class="text-indigo-600 font-semibold hover:text-indigo-700">서비스 이용 신청 →</a>
    </div>
  </div>

  <p class="text-center text-[12px] text-slate-400 mt-6">
    이용 신청 후 승인이 완료되면 로그인 안내 메일이 발송됩니다.
  </p>
  <div id="loginInstall" data-install-slot class="hidden mt-6"></div>
  <div id="pageFooter" class="mt-8 pt-5 border-t border-slate-200"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyBxB2PoM3Ij_F35Kw3lNTIpKeTmZX0yGSI",
  authDomain: "openmanager-d6571.firebaseapp.com",
  projectId: "openmanager-d6571",
  storageBucket: "openmanager-d6571.firebasestorage.app",
  messagingSenderId: "249141913323",
  appId: "1:249141913323:web:f5f5fd678b895dc02400ae"
});
const auth = getAuth(app);
auth.languageCode = 'ko';   // 비밀번호 재설정 등 Firebase 자동 메일을 한국어로 발송
const db = getFirestore(app);

function showErr(msg){
  const el = document.getElementById('errMsg');
  el.textContent = msg; el.classList.remove('hidden');
}

window.doLogin = async function(){
  const email = document.getElementById('email').value.trim();
  const pw = document.getElementById('password').value;
  document.getElementById('errMsg').classList.add('hidden');
  if(!email || !pw){ showErr('이메일과 비밀번호를 입력해 주세요.'); return; }
  const btn = document.getElementById('loginBtn');
  btn.disabled = true; btn.textContent = '확인 중...';
  try{
    const cred = await signInWithEmailAndPassword(auth, email, pw);
    const uSnap = await getDoc(doc(db,'users',cred.user.uid));
    if(!uSnap.exists()){
      showErr('계정 정보가 없습니다. 관리자에게 문의해 주세요.');
      btn.disabled=false; btn.textContent='로그인'; return;
    }
    const u = uSnap.data();
    if(u.role === 'super'){ location.href = 'admin.html'; }
    else if(u.role === 'company'){ location.href = 'company.html'; } else {
      showErr('접근 권한이 없는 계정입니다.');
      btn.disabled=false; btn.textContent='로그인';
    }
  }catch(e){
    const code = e.code || '';
    if(code.includes('invalid-credential') || code.includes('wrong-password') || code.includes('user-not-found'))
      showErr('이메일 또는 비밀번호가 올바르지 않습니다.');
    else if(code.includes('too-many-requests'))
      showErr('시도 횟수가 많습니다. 잠시 후 다시 시도해 주세요.');
    else showErr('로그인에 실패했습니다. (' + code + ')');
    btn.disabled=false; btn.textContent='로그인';
  }
};

window.resetPassword = async function(){
  const email = document.getElementById('email').value.trim();
  if(!email){ showErr('재설정 메일을 받을 이메일을 위 칸에 먼저 입력해 주세요.'); return; }
  try{
    await sendPasswordResetEmail(auth, email);
    alert('비밀번호 재설정 메일을 보냈습니다. 메일함(스팸함 포함)을 확인해 주세요.');
  }catch(e){
    showErr('메일 발송에 실패했습니다. 이메일 주소를 확인해 주세요.');
  }
};

document.addEventListener('keydown', e => { if(e.key==='Enter') window.doLogin(); });
</script>
<script>renderFooter("pageFooter","light");
if(window.wasIdleLogout && wasIdleLogout()) document.getElementById('idleNotice').classList.remove('hidden');
if(window.renderInstallButton) renderInstallButton("loginInstall","full");</script>
<script>
// 홈 화면 앱으로 설치할 수 있게 등록 (화면만 저장하며 데이터는 항상 서버에서 가져옵니다)
if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(e => console.warn('SW 등록 실패:', e));
  });
}
</script>
</body>
</html>
